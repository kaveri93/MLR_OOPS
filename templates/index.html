<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Profit Prediction</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            color: #fff;
        }
        header {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        input:focus, select:focus {
            box-shadow: 0 0 8px #fff;
        }
        button {
            background: #ff6f61;
            color: #fff;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            background: #ff3b2e;
        }
        .result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            color: #ffe082;
        }
    </style>
</head>
<body>
    <header> Startup Profit Prediction by kaveri</header>
    <div class="container">
        <form action="/predict" method="POST" id="predictionForm">
            <div class="form-group">
                <label for="rd">R&D Spend</label>
                <input type="number" step="any" name="rd" id="rd" required>
            </div>
            <div class="form-group">
                <label for="admin">Administration</label>
                <input type="number" step="any" name="admin" id="admin" required>
            </div>
            <div class="form-group">
                <label for="ms">Marketing Spend</label>
                <input type="number" step="any" name="ms" id="ms" required>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <select name="state" id="state" required>
                    <option value="0">New York</option>
                    <option value="1">California</option>
                    <option value="2">Florida</option>
                </select>
            </div>
            <button type="submit">Predict Profit</button>
        </form>
        <div class="result">
            {% if prediction_text %}
                {{ prediction_text }}
            {% endif %}
        </div>
    </div>

    <script>
        document.getElementById("predictionForm").addEventListener("submit", function() {
            document.querySelector("button").innerText = "Predicting...";
        });
    </script>
</body>
</html>
